# =============================================================================
# config.yaml
# Central configuration for Autonomous Racing with Assetto Corsa + PPO
# All hyperparameters, environment settings, file paths, and execution modes.
# Avoids hard-coding values in Python files.
# =============================================================================

# ---------------------------------------------------------------------------
# Environment Settings
# ---------------------------------------------------------------------------
environment:
  ac_config_path: "config.yml"
  work_dir: "output"
  obs_dim: 125
  act_dim: 3

# ---------------------------------------------------------------------------
# PPO Hyperparameters
# ---------------------------------------------------------------------------
ppo:
  learning_rate: 3.0e-4
  gamma: 0.99                           # Discount factor
  gae_lambda: 0.95                      # GAE smoothing parameter
  clip_epsilon: 0.2                     # PPO clip ratio
  value_loss_coef: 0.5                  # Value function loss coefficient
  entropy_coef: 0.01                    # Entropy bonus (exploration)
  max_grad_norm: 0.5                    # Gradient clipping threshold
  n_steps: 2048                         # Rollout steps before each update
  n_epochs: 10                          # Optimization epochs per rollout
  batch_size: 64                        # Mini-batch size for PPO update
  normalize_advantages: true

# ---------------------------------------------------------------------------
# Network Architecture
# ---------------------------------------------------------------------------
network:
  hidden_dims: [256, 256]               # MLP hidden layer sizes
  activation: "tanh"                    # Activation function
  # Actor output: continuous action space (steering, throttle, brake)
  # Critic output: single scalar value estimate

# ---------------------------------------------------------------------------
# Training Settings
# ---------------------------------------------------------------------------
training:
  total_timesteps: 1_000_000           # Total environment steps
  eval_interval: 10000                  # Steps between evaluation runs
  eval_episodes: 5                      # Number of evaluation episodes
  save_interval: 50000                  # Steps between checkpoint saves
  log_interval: 2048                    # Steps between log prints
  seed: 42

# ---------------------------------------------------------------------------
# File Paths
# ---------------------------------------------------------------------------
paths:
  results_dir: "ppo_results/"
  checkpoint_prefix: "ppo_results/ppo_checkpoint"
  best_model_path: "ppo_results/ppo_best_model.pt"
  training_history: "ppo_results/training_history.csv"
  plots_dir: "ppo_results/plots/"

# ---------------------------------------------------------------------------
# Execution Mode
# ---------------------------------------------------------------------------
mode:
  train: true           # Set to false to skip training
  evaluate: true        # Set to true to run evaluation after training
  render: false         # Not applicable for AC (game window is always shown)
  resume: false         # Resume from latest checkpoint
  resume_path: ""       # Path to checkpoint to resume from
